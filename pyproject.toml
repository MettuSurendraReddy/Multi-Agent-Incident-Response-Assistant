[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-incident-copilot"
version = "0.1.0"
description = "A local multi-agent incident investigation demo using simulated incidents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0,<4",
    "groq>=0.15,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
